[package]
name = "arc_explorer"
version = "1.4.5"
edition = "2024"

[dependencies]
directories = "6.0.0"
gpui-kit = "0.11.0"
itertools = "0.15.0"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smash-arc = { git = "https://github.com/jam1garner/smash-arc", features = ["libzstd", "search"], rev = "23418af" }

# Make ARC loading faster in debug mode.
[profile.dev]
opt-level = 1

[package.metadata.bundle]
identifier = "arc_explorer"
icon = ["src/icons/ArcExplorer.icns"]
