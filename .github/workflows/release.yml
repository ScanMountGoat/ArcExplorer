name: Compile Release

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: cargo build --release
      - name: Set Icon
        run: |
          curl.exe -sSL "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -o rcedit.exe
          .\rcedit.exe target/release/arc_explorer.exe --set-icon src/icons/icon.ico
      - name: Create Zip
        run: Compress-Archive -path target/release/arc_explorer.exe -destinationPath arc_explorer_win_x64.zip
      - name: Upload Zip
        uses: actions/upload-artifact@v7
        with:
          name: arc_explorer_win_x64
          path: arc_explorer_win_x64.zip
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: arc_explorer_win_x64.zip
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin]
        desc: [intel]
        include:
          - target: aarch64-apple-darwin
            desc: apple_silicon
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{matrix.target}}
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-bundle
        run: cargo binstall cargo-bundle --version 0.12.0
      - name: Bundle
        run: cargo bundle --release --format osx --target ${{matrix.target}}
      - name: Sign Binaries
        run: codesign -s - target/${{matrix.target}}/release/bundle/osx/arc_explorer.app
      - name: Create Zip
        run: |
          cp -r target/${{matrix.target}}/release/bundle/osx/arc_explorer.app arc_explorer.app
          zip -r arc_explorer_macos_${{matrix.desc}}.zip arc_explorer.app
      - name: Upload Zip
        uses: actions/upload-artifact@v7
        with:
          name: arc_explorer_macos_${{matrix.desc}}
          path: arc_explorer_macos_${{matrix.desc}}.zip
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: arc_explorer_macos_${{matrix.desc}}.zip
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-bundle
        run: cargo binstall cargo-bundle --version 0.12.0
      - name: Install Ubuntu Dependencies
        run: |
          sudo apt update
          sudo apt install -y libfontconfig-dev \
          libxkbcommon-x11-dev
      - name: Bundle
        run: cargo bundle --release --format appimage
      - name: Create Zip
        run: zip -j arc_explorer_linux_x64.zip target/release/bundle/appimage/*.AppImage
      - name: Upload Zip
        uses: actions/upload-artifact@v7
        with:
          name: arc_explorer_linux_x64
          path: arc_explorer_linux_x64.zip
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: arc_explorer_linux_x64.zip
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
